[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chordlistener"
version = "0.1.0"
description = "Audio to chords, notes and sheet music"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
]
train = [
    "scikit-learn>=1.4",
    "pyyaml>=6",
]
# Fine-tuning the high-accuracy models (tools/guitar_finetune.py). Install PyTorch
# with CUDA first, from https://pytorch.org (the plain PyPI build has no GPU support on Windows).
finetune = [
    "torch>=2.4",
    "torchlibrosa>=0.1",
    "piano_transcription_inference>=0.0.6",
    "librosa>=0.10",
    "audioread>=3",
    "mido>=1.3",
    "matplotlib>=3.7",
    "onnx>=1.16",
]

[project.scripts]
chordlistener = "chordlistener.cli:main"

[tool.setuptools.packages.find]
include = ["chordlistener*"]

[tool.setuptools.package-data]
chordlistener = ["models/*", "server/web/*", "server/web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
